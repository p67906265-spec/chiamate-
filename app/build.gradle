plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.paolo.gestionechiamate'
    compileSdk 34

    defaultConfig {
        applicationId "com.paolo.gestionechiamate"
        minSdk 24
        targetSdk 34
        versionCode 20
        versionName "1.19"
    }

    // Chiave di firma fissa: senza questa, ogni build su GitHub Actions genera
    // una chiave diversa e Android rifiuta l'aggiornamento chiedendo di
    // disinstallare prima. Con questa chiave fissa gli aggiornamenti funzionano
    // normalmente (basta installare il nuovo APK sopra il vecchio).
    signingConfigs {
        fissa {
            storeFile file("../keystore/gestione-chiamate.keystore")
            storePassword "gestionechiamate2026"
            keyAlias "gestionechiamate"
            keyPassword "gestionechiamate2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fissa
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fissa
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
